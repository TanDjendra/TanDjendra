<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img" aria-label="TanDjendra Cyber Arcade - marquee arcade dengan attract mode">
  <title>TANDJENDRA CYBER ARCADE</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241546"/>
      <stop offset="55%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#120a22"/>
    </linearGradient>

    <linearGradient id="marquee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2168"/>
      <stop offset="100%" stop-color="#221340"/>
    </linearGradient>

    <linearGradient id="sideart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8fd0" stop-opacity=".85"/>
      <stop offset="50%" stop-color="#b99bff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7fffe0" stop-opacity=".25"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".26"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fffe0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7fffe0" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#7fffe0" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="crt"><rect x="96" y="92" width="668" height="126" rx="9"/></clipPath>

    <!-- ===== Space Invader, 11x8 piksel, sel 3px ===== -->
    <g id="invader" fill="currentColor">
      <rect x="6"  y="0"  width="3"  height="3"/><rect x="24" y="0"  width="3"  height="3"/>
      <rect x="9"  y="3"  width="3"  height="3"/><rect x="21" y="3"  width="3"  height="3"/>
      <rect x="6"  y="6"  width="21" height="3"/>
      <rect x="3"  y="9"  width="6"  height="3"/><rect x="12" y="9"  width="9"  height="3"/><rect x="24" y="9" width="6" height="3"/>
      <rect x="0"  y="12" width="33" height="3"/>
      <rect x="0"  y="15" width="3"  height="3"/><rect x="6"  y="15" width="21" height="3"/><rect x="30" y="15" width="3" height="3"/>
      <rect x="0"  y="18" width="3"  height="3"/><rect x="6"  y="18" width="3"  height="3"/>
      <rect x="24" y="18" width="3"  height="3"/><rect x="30" y="18" width="3"  height="3"/>
      <!-- kaki: dua frame bergantian -->
      <g>
        <rect x="9" y="21" width="6" height="3"/><rect x="18" y="21" width="6" height="3"/>
        <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <rect x="3" y="21" width="3" height="3"/><rect x="12" y="21" width="3" height="3"/>
        <rect x="18" y="21" width="3" height="3"/><rect x="27" y="21" width="3" height="3"/>
        <animate attributeName="opacity" values="0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ===== Kapal pemain ===== -->
    <g id="ship" fill="#7fffe0">
      <rect x="15" y="0"  width="3"  height="3"/>
      <rect x="12" y="3"  width="9"  height="3"/>
      <rect x="12" y="6"  width="9"  height="3"/>
      <rect x="0"  y="9"  width="33" height="3"/>
      <rect x="0"  y="12" width="33" height="3"/>
      <rect x="0"  y="15" width="6"  height="3"/><rect x="27" y="15" width="6" height="3"/>
    </g>
  </defs>

  <!-- latar -->
  <rect width="860" height="260" rx="14" fill="url(#sky)"/>

  <!-- bintang berkedip -->
  <g fill="#f5f0ff">
    <circle cx="60"  cy="34"  r="1.5" opacity=".8"><animate attributeName="opacity" values=".15;.9;.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="812" cy="52"  r="1.5" opacity=".6"><animate attributeName="opacity" values=".8;.1;.8"  dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="42"  cy="212" r="1.5" opacity=".5"><animate attributeName="opacity" values=".1;.7;.1"  dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="826" cy="196" r="1.5" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- side art kabinet -->
  <rect x="18" y="30" width="10" height="204" rx="5" fill="url(#sideart)"/>
  <rect x="832" y="30" width="10" height="204" rx="5" fill="url(#sideart)"/>

  <!-- ===== MARQUEE ===== -->
  <rect x="40" y="20" width="780" height="60" rx="10" fill="url(#marquee)" stroke="#b99bff" stroke-width="2"/>

  <!-- bohlam marquee, menyala berurutan -->
  <g fill="#ffe68a">
    <circle cx="62"  cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle cx="122" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.17s" repeatCount="indefinite"/></circle>
    <circle cx="182" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.34s" repeatCount="indefinite"/></circle>
    <circle cx="242" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.51s" repeatCount="indefinite"/></circle>
    <circle cx="302" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.68s" repeatCount="indefinite"/></circle>
    <circle cx="362" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.85s" repeatCount="indefinite"/></circle>
    <circle cx="422" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-1.02s" repeatCount="indefinite"/></circle>
    <circle cx="482" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-1.19s" repeatCount="indefinite"/></circle>
    <circle cx="542" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-1.36s" repeatCount="indefinite"/></circle>
    <circle cx="602" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.1s"  repeatCount="indefinite"/></circle>
    <circle cx="662" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.27s" repeatCount="indefinite"/></circle>
    <circle cx="722" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.44s" repeatCount="indefinite"/></circle>
    <circle cx="782" cy="20" r="3.4"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" begin="-.61s" repeatCount="indefinite"/></circle>
  </g>

  <!-- judul neon + kedip halus -->
  <g filter="url(#glow)" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold">
    <text x="430" y="52" font-size="27" fill="#ffe68a" letter-spacing="5">TANDJENDRA
      <animate attributeName="opacity" values="1;1;.72;1;1;.9;1" dur="5.5s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="70" font-size="12" fill="#7fffe0" letter-spacing="9">C Y B E R &#160; A R C A D E</text>
  </g>

  <!-- ===== LAYAR CRT ===== -->
  <rect x="92" y="88" width="676" height="134" rx="12" fill="#0d0719" stroke="#7a5fbe" stroke-width="2"/>
  <g clip-path="url(#crt)">
    <rect x="96" y="92" width="668" height="126" fill="#0b0617"/>

    <!-- armada invader: melangkah kiri-kanan -->
    <g transform="translate(0,0)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;16 0;32 0;48 0;64 0;80 0;64 0;48 0;32 0;16 0"
        calcMode="discrete" dur="5s" repeatCount="indefinite"/>
      <g color="#ff8fd0">
        <use href="#invader" x="200" y="104"/><use href="#invader" x="260" y="104"/>
        <use href="#invader" x="320" y="104"/><use href="#invader" x="380" y="104"/>
        <use href="#invader" x="440" y="104"/><use href="#invader" x="500" y="104"/>
      </g>
      <g color="#b99bff">
        <use href="#invader" x="200" y="136"/><use href="#invader" x="260" y="136"/>
        <use href="#invader" x="320" y="136"/><use href="#invader" x="380" y="136"/>
        <use href="#invader" x="440" y="136"/><use href="#invader" x="500" y="136"/>
      </g>
    </g>

    <!-- kapal pemain menyapu kiri-kanan -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;250 0;0 0" dur="7s" calcMode="spline"
        keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <use href="#ship" x="290" y="186"/>
    </g>

    <!-- peluru -->
    <rect x="0" y="0" width="3" height="9" fill="#ffe68a">
      <animate attributeName="x" values="306;306;430;430" keyTimes="0;.5;.5;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="184;120;184;120" dur="1.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.75s" repeatCount="indefinite"/>
    </rect>

    <!-- UFO lewat sesekali -->
    <g fill="#7fffe0" opacity=".9">
      <animateTransform attributeName="transform" type="translate" values="-80 0;760 0" dur="9s" repeatCount="indefinite"/>
      <rect x="100" y="96" width="24" height="3"/><rect x="94" y="99" width="36" height="3"/>
      <rect x="88" y="102" width="48" height="3"/><rect x="100" y="105" width="6" height="3"/>
      <rect x="118" y="105" width="6" height="3"/>
    </g>

    <!-- INSERT COIN berkedip -->
    <text x="430" y="212" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold"
          font-size="12" fill="#ffe68a" letter-spacing="3" filter="url(#softglow)">INSERT COIN
      <animate attributeName="opacity" values="1;1;0;0" dur="1.6s" calcMode="discrete" repeatCount="indefinite"/>
    </text>

    <!-- HUD -->
    <text x="108" y="108" font-family="'Courier New',monospace" font-size="10" fill="#7fffe0" letter-spacing="1.5">1UP</text>
    <text x="108" y="122" font-family="'Courier New',monospace" font-size="10" fill="#f5f0ff" letter-spacing="1.5">999999</text>
    <text x="752" y="108" text-anchor="end" font-family="'Courier New',monospace" font-size="10" fill="#ff8fd0" letter-spacing="1.5">RANK A</text>

    <!-- scanline + sapuan CRT -->
    <rect x="96" y="92" width="668" height="126" fill="url(#scan)"/>
    <rect x="96" y="0" width="668" height="46" fill="url(#sweep)">
      <animate attributeName="y" values="60;220;60" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- dek kontrol -->
  <g>
    <rect x="92" y="230" width="676" height="16" rx="8" fill="#241546" stroke="#7a5fbe" stroke-width="1.5"/>
    <!-- joystick -->
    <circle cx="150" cy="238" r="5" fill="#ff8fd0">
      <animate attributeName="cx" values="150;158;150;142;150" dur="5s" repeatCount="indefinite"/>
    </circle>
    <!-- tombol -->
    <circle cx="640" cy="238" r="4.5" fill="#ffe68a"><animate attributeName="opacity" values="1;.35;1" dur="1.75s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="238" r="4.5" fill="#7fffe0"><animate attributeName="opacity" values=".35;1;.35" dur="1.75s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="238" r="4.5" fill="#b99bff"><animate attributeName="opacity" values="1;.35;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <text x="430" y="242" text-anchor="middle" font-family="'Courier New',monospace" font-size="9"
          fill="#b99bff" letter-spacing="4">1P START</text>
  </g>
</svg>
