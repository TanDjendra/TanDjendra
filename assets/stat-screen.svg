<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Stat screen: bar keahlian TanDjendra, dikelompokkan HP bahasa dan runtime, MP framework dan tools, XP visual dan motion">
  <title>STAT SCREEN — LOADOUT</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1136"/><stop offset="100%" stop-color="#120a22"/>
    </linearGradient>
    <filter id="g2" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sc2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".22"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="860" height="400" rx="12" fill="url(#bg)" stroke="#7a5fbe" stroke-width="2"/>

  <!-- header -->
  <text x="28" y="34" font-family="'Courier New',monospace" font-weight="bold" font-size="14"
        fill="#ffe68a" letter-spacing="4" filter="url(#g2)">STAT SCREEN</text>
  <text x="832" y="34" text-anchor="end" font-family="'Courier New',monospace" font-weight="bold"
        font-size="13" fill="#ff8fd0" letter-spacing="3">PARTY RANK
    <tspan fill="#ffe68a" font-size="16"> A</tspan>
  </text>
  <line x1="28" y1="44" x2="832" y2="44" stroke="#7a5fbe" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ================= HP ================= -->
  <text x="28" y="70" font-family="'Courier New',monospace" font-weight="bold" font-size="12"
        fill="#ff9e9e" letter-spacing="2">HP &#183; BAHASA &amp; RUNTIME</text>
  <text x="250" y="70" font-family="'Courier New',monospace" font-size="10" fill="#9d87c9"
        letter-spacing=".5">yang dipakai buat bikin logikanya jalan</text>

  <g font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5">
    <!-- PYTHON 93 -->
    <text x="28" y="94" fill="#f5f0ff">PYTHON</text>
    <rect x="170" y="84" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="84" height="12" rx="2" fill="#7fffe0" width="0">
      <animate attributeName="width" from="0" to="484" dur="1.1s" begin="0.1s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="94" fill="#ffe68a" font-weight="bold" font-size="9" letter-spacing="1">LEGENDARY</text>

    <!-- JAVASCRIPT 88 -->
    <text x="28" y="116" fill="#f5f0ff">JAVASCRIPT</text>
    <rect x="170" y="106" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="106" height="12" rx="2" fill="#7fffe0" width="0">
      <animate attributeName="width" from="0" to="458" dur="1.1s" begin="0.2s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="116" fill="#ff8fd0" font-weight="bold" font-size="9" letter-spacing="1">EPIC</text>

    <!-- PHP 84 -->
    <text x="28" y="138" fill="#f5f0ff">PHP</text>
    <rect x="170" y="128" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="128" height="12" rx="2" fill="#7fffe0" width="0">
      <animate attributeName="width" from="0" to="437" dur="1.1s" begin="0.3s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="138" fill="#b99bff" font-weight="bold" font-size="9" letter-spacing="1">RARE</text>

    <!-- KOTLIN 78 -->
    <text x="28" y="160" fill="#f5f0ff">KOTLIN</text>
    <rect x="170" y="150" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="150" height="12" rx="2" fill="#7fffe0" width="0">
      <animate attributeName="width" from="0" to="406" dur="1.1s" begin="0.4s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="160" fill="#5fd8c0" font-weight="bold" font-size="9" letter-spacing="1">COMMON</text>

    <!-- MYSQL 74 -->
    <text x="28" y="182" fill="#f5f0ff">MYSQL</text>
    <rect x="170" y="172" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="172" height="12" rx="2" fill="#7fffe0" width="0">
      <animate attributeName="width" from="0" to="385" dur="1.1s" begin="0.5s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="182" fill="#5fd8c0" font-weight="bold" font-size="9" letter-spacing="1">COMMON</text>
  </g>

  <!-- ================= MP ================= -->
  <text x="28" y="212" font-family="'Courier New',monospace" font-weight="bold" font-size="12"
        fill="#7fffe0" letter-spacing="2">MP &#183; FRAMEWORK &amp; TOOLS</text>
  <text x="250" y="212" font-family="'Courier New',monospace" font-size="10" fill="#9d87c9"
        letter-spacing=".5">yang dipakai buat merakitnya jadi produk</text>

  <g font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5">
    <!-- LARAVEL 92 -->
    <text x="28" y="236" fill="#f5f0ff">LARAVEL</text>
    <rect x="170" y="226" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="226" height="12" rx="2" fill="#ff8fd0" width="0">
      <animate attributeName="width" from="0" to="478" dur="1.1s" begin="0.6s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="236" fill="#ffe68a" font-weight="bold" font-size="9" letter-spacing="1">LEGENDARY</text>

    <!-- TAILWIND 82 -->
    <text x="28" y="258" fill="#f5f0ff">TAILWIND</text>
    <rect x="170" y="248" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="248" height="12" rx="2" fill="#ff8fd0" width="0">
      <animate attributeName="width" from="0" to="426" dur="1.1s" begin="0.7s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="258" fill="#b99bff" font-weight="bold" font-size="9" letter-spacing="1">RARE</text>

    <!-- GIT 80 -->
    <text x="28" y="280" fill="#f5f0ff">GIT</text>
    <rect x="170" y="270" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="270" height="12" rx="2" fill="#ff8fd0" width="0">
      <animate attributeName="width" from="0" to="416" dur="1.1s" begin="0.8s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="280" fill="#b99bff" font-weight="bold" font-size="9" letter-spacing="1">RARE</text>

    <!-- NEXT.JS 76 -->
    <text x="28" y="302" fill="#f5f0ff">NEXT.JS</text>
    <rect x="170" y="292" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="292" height="12" rx="2" fill="#ff8fd0" width="0">
      <animate attributeName="width" from="0" to="395" dur="1.1s" begin="0.9s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="302" fill="#5fd8c0" font-weight="bold" font-size="9" letter-spacing="1">COMMON</text>
  </g>

  <!-- ================= XP ================= -->
  <text x="28" y="332" font-family="'Courier New',monospace" font-weight="bold" font-size="12"
        fill="#b99bff" letter-spacing="2">XP &#183; VISUAL &amp; MOTION</text>
  <text x="250" y="332" font-family="'Courier New',monospace" font-size="10" fill="#9d87c9"
        letter-spacing=".5">yang dipakai buat bikin orang mau melihat</text>

  <g font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5">
    <!-- AFTER EFFECTS 89 -->
    <text x="28" y="356" fill="#f5f0ff">AFTER EFFECTS</text>
    <rect x="170" y="346" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="346" height="12" rx="2" fill="#b99bff" width="0">
      <animate attributeName="width" from="0" to="463" dur="1.1s" begin="1s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="356" fill="#ff8fd0" font-weight="bold" font-size="9" letter-spacing="1">EPIC</text>

    <!-- FIGMA 72 -->
    <text x="28" y="378" fill="#f5f0ff">FIGMA</text>
    <rect x="170" y="368" width="520" height="12" rx="2" fill="#241546"/>
    <rect x="170" y="368" height="12" rx="2" fill="#b99bff" width="0">
      <animate attributeName="width" from="0" to="374" dur="1.1s" begin="1.1s" fill="freeze"
               calcMode="spline" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="704" y="378" fill="#5fd8c0" font-weight="bold" font-size="9" letter-spacing="1">COMMON</text>
  </g>

  <!-- kilau melintas bar -->
  <rect x="0" y="80" width="70" height="304" fill="url(#shine)" opacity=".30">
    <animate attributeName="x" values="-70;860" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline CRT -->
  <rect width="860" height="400" rx="12" fill="url(#sc2)"/>

  <!-- kursor berkedip -->
  <rect x="805" y="368" width="9" height="12" fill="#7fffe0">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
